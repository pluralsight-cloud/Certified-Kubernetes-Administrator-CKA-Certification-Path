apiVersion: v1
kind: Pod
metadata:
  name: globo-fast-local
  namespace: globo-storage
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: analytics
          mountPath: /analytics
  volumes:
    - name: analytics
      persistentVolumeClaim:
        claimName: globo-fast-local-pvc
