apiVersion: v1
kind: Pod
metadata:
  name: globo-uploads
  namespace: globo-storage
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: uploads
          mountPath: /uploads
  volumes:
    - name: uploads
      persistentVolumeClaim:
        claimName: globo-explicit-pvc
