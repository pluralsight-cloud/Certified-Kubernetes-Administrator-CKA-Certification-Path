# Consumes the claim that omitted storageClassName, so the default class provisions brand-new storage instead of binding the hand-made PV.
apiVersion: v1
kind: Pod
metadata:
  name: globo-noclass
  namespace: globo-storage
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: globo-noclass-pvc
