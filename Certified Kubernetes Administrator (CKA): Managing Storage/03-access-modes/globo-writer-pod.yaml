apiVersion: v1
kind: Pod
metadata:
  name: globo-writer
  namespace: globo-storage
  labels:
    app: globo-writer
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: shared
          mountPath: /shared
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: globo-shared-pvc
