# Forced onto a different node from globo-writer via pod anti-affinity.
# The volume lives on the writer's node, so this pod cannot be scheduled.
apiVersion: v1
kind: Pod
metadata:
  name: globo-cross-node
  namespace: globo-storage
spec:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: globo-writer
          topologyKey: kubernetes.io/hostname
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: shared
          mountPath: /shared
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: globo-shared-pvc
