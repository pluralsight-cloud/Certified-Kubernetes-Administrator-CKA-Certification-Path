apiVersion: v1
kind: Pod
metadata:
  name: globo-audit
  namespace: globo-storage
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: audit
          mountPath: /audit
  volumes:
    - name: audit
      persistentVolumeClaim:
        claimName: globo-retain-pvc
