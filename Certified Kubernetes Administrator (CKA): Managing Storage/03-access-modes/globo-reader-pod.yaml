# Scheduled onto the same node as globo-writer via pod affinity, so it shares the ReadWriteOnce volume. Access modes are enforced per node, not per pod.
apiVersion: v1
kind: Pod
metadata:
  name: globo-reader
  namespace: globo-storage
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: globo-writer
          topologyKey: kubernetes.io/hostname
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: shared
          mountPath: /shared
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: globo-shared-pvc
