apiVersion: v1
kind: Pod
metadata:
  name: globo-cache
  namespace: globo-storage
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: cache
          mountPath: /cache
  volumes:
    - name: cache
      persistentVolumeClaim:
        claimName: globo-delete-pvc
