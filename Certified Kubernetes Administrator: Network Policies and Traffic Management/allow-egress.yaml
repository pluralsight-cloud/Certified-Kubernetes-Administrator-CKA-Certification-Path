apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: analytics
spec:
  podSelector: {}          # applies to all pods in the analytics namespace
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}   # allow to any namespace (needed to reach kube-dns/coredns)
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
