apiVersion: v1
kind: Pod
metadata:
  name: globo-catalog-sidecar
  namespace: globomantics
  labels:
    app: globo-catalog-sidecar
spec:
  restartPolicy: Always
  volumes:
    - name: app-logs
      emptyDir: {}
  initContainers:
    # restartPolicy Always turns this init container into a native sidecar.
    - name: log-forwarder
      image: busybox:1.36
      restartPolicy: Always
      command:
        - sh
        - -c
        - "touch /var/log/app/access.log && tail -F /var/log/app/access.log"
      volumeMounts:
        - name: app-logs
          mountPath: /var/log/app
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - "trap 'exit 1' TERM; while true; do echo \"$(date) GET /catalog 200\" >> /var/log/app/access.log; sleep 5; done"
      volumeMounts:
        - name: app-logs
          mountPath: /var/log/app
