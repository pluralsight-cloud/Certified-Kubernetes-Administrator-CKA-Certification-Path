apiVersion: apps/v1
kind: Deployment
metadata:
  name: globo-frontend
  namespace: globomantics
  labels:
    app: globo-frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: globo-frontend
  template:
    metadata:
      labels:
        app: globo-frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
              
          # Creates the file the liveness probe reads.
          lifecycle:
            postStart:
              exec:
                command: ["sh", "-c", "echo ok > /usr/share/nginx/html/healthz"]

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
