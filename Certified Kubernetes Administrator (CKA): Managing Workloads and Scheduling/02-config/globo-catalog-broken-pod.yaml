apiVersion: v1
kind: Pod
metadata:
  name: globo-catalog-broken
  namespace: globomantics
spec:
  containers:
    - name: catalog
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        # FEATURE_FLAGS does not exist yet, so the pod stalls in CreateContainerConfigError.
        - name: FEATURE_FLAGS
          valueFrom:
            configMapKeyRef:
              name: globo-catalog-config
              key: FEATURE_FLAGS
