apiVersion: v1
kind: Pod
metadata:
  name: globo-catalog-optional
  namespace: globomantics
spec:
  containers:
    - name: catalog
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: MISSING_KEY
          valueFrom:
            configMapKeyRef:
              name: globo-catalog-config
              key: MISSING_KEY
              optional: true
