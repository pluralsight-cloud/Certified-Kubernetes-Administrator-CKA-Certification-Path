apiVersion: v1
kind: Pod
metadata:
  name: globo-catalog-volume
  namespace: globomantics
  labels:
    app: globo-catalog-volume
spec:
  volumes:
    - name: catalog-config
      configMap:
        name: globo-catalog-file
    - name: catalog-credentials
      secret:
        secretName: globo-catalog-secret
        defaultMode: 0400
  containers:
    - name: catalog
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: catalog-config
          mountPath: /etc/catalog
          readOnly: true
        - name: catalog-credentials
          mountPath: /etc/catalog-credentials
          readOnly: true
