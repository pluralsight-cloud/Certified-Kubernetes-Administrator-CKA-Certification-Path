apiVersion: v1
kind: Pod
metadata:
  name: globo-catalog-sized
  namespace: globomantics
spec:
  containers:
    - name: catalog
      image: nginx:1.31
      # Right-sized: fits comfortably on any worker node.
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 250m
          memory: 256Mi
