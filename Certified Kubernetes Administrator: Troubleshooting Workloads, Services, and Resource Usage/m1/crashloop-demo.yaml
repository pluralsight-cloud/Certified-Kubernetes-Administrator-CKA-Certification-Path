apiVersion: v1
kind: ConfigMap
metadata:
  name: broken-app-code
data:
  app.py: |
    import time

    # BUG: missing colon after the function signature -> SyntaxError
    def main()
        print("Starting the app...")
        while True:
            print("still alive")
            time.sleep(5)

    if __name__ == "__main__":
        main()
---
apiVersion: v1
kind: Pod
metadata:
  name: broken-python-app
  labels:
    app: broken-python-app
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: python:3.12-slim
      command: ["python", "/app/app.py"]
      volumeMounts:
        - name: code
          mountPath: /app
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
  volumes:
    - name: code
      configMap:
        name: broken-app-code
