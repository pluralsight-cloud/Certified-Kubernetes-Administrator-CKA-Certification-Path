apiVersion: v1
kind: Service
metadata:
  name: flaky-headless
spec:
  clusterIP: None
  selector:
    app: flaky-app
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flaky-statefulset
spec:
  serviceName: flaky-headless
  replicas: 4
  selector:
    matchLabels:
      app: flaky-app
  template:
    metadata:
      labels:
        app: flaky-app
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command: ["python", "-u", "-c"]
          args:
            - |
              import os
              import time

              # StatefulSet pods are named <name>-0, <name>-1, <name>-2, ...
              # so the ordinal is a reliable, deterministic way to split them.
              pod_name = os.environ.get("POD_NAME", "unknown-0")
              ordinal = int(pod_name.rsplit("-", 1)[-1])

              should_crash = ordinal % 2 == 0  # 0, 2 crash; 1, 3 run fine

              print(f"[{pod_name}] starting, ordinal={ordinal}, should_crash={should_crash}")

              if should_crash:
                  print(f"[{pod_name}] simulating startup work...")
                  time.sleep(5)
                  print(f"[{pod_name}] hit a fatal error, crashing now")
                  raise RuntimeError(f"simulated crash in {pod_name}")
              else:
                  while True:
                      print(f"[{pod_name}] healthy and running")
                      time.sleep(10)
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
