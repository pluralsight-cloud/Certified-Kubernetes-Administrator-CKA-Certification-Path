apiVersion: v1
kind: Pod
metadata:
  name: init-fail-demo
  labels:
    app: init-fail-demo
spec:
  restartPolicy: Always

  volumes:
    - name: shared-config
      emptyDir: {}

  initContainers:
    - name: config-writer
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "[init] writing config to shared volume..."
          cat > /shared/app.conf <<'EOF'
          # generated by the config-writer init container
          mode=demo
          log_level=debug
          upstream=http://example.internal:8080
          EOF
          echo "[init] config written:"
          cat /shared/app.conf
          echo "[init] now failing on purpose"
          exit 1
      volumeMounts:
        - name: shared-config
          mountPath: /shared

  containers:
    - name: app
      image: python:3.12-slim
      command: ["python", "-u", "-c"]
      args:
        - |
          import time
          with open("/shared/app.conf") as f:
              print("[app] loaded config:\n" + f.read())
          while True:
              print("[app] running")
              time.sleep(10)
      volumeMounts:
        - name: shared-config
          mountPath: /shared
      resources:
        requests: {cpu: "10m", memory: "32Mi"}
        limits: {cpu: "200m", memory: "128Mi"}

    - name: sidecar
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            echo "[sidecar] watching config, $(wc -l < /shared/app.conf) lines"
            sleep 15
          done
      volumeMounts:
        - name: shared-config
          mountPath: /shared
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "100m", memory: "64Mi"}
